<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EC8FF"/>
      <stop offset="100%" stop-color="#003BDE"/>
    </linearGradient>

    <linearGradient id="cartGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="90" fill="url(#bgGradient)"/>

  <!-- Speed Lines -->
  <rect x="85" y="180" width="90" height="12" rx="6" fill="#FFD000"/>
  <rect x="70" y="215" width="105" height="12" rx="6" fill="#FFD000"/>
  <rect x="95" y="250" width="80" height="12" rx="6" fill="#FFD000"/>

  <!-- Shopping Cart -->
  <g filter="url(#shadow)">
    <path d="M170 150H380C395 150 405 165 400 178L360 285C356 296 346 304 334 304H220C208 304 198 296 194 285L155 170C150 158 158 150 170 150Z"
      fill="url(#cartGradient)"/>

    <!-- Cart Handle -->
    <path d="M145 120H200" stroke="#FF9A00" stroke-width="18" stroke-linecap="round"/>
    <path d="M200 120L220 170" stroke="#FF9A00" stroke-width="18" stroke-linecap="round"/>

    <!-- Letter e -->
    <text x="275" y="255"
      text-anchor="middle"
      font-size="130"
      font-family="Arial, sans-serif"
      font-weight="bold"
      fill="white">
      e
    </text>

    <!-- Wheels -->
    <circle cx="235" cy="340" r="28" fill="#FF7A00"/>
    <circle cx="235" cy="340" r="12" fill="white"/>

    <circle cx="340" cy="340" r="28" fill="#FF7A00"/>
    <circle cx="340" cy="340" r="12" fill="white"/>
  </g>

  <!-- ekart text -->
  <text x="256" y="445"
    text-anchor="middle"
    font-size="88"
    font-family="Poppins, Arial, sans-serif"
    font-weight="bold"
    fill="white"
    letter-spacing="1">
    kart
  </text>
</svg>